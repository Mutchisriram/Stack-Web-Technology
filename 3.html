<!DOCTYPE html>
<html>
<head>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<ul id="list">
<li>Ravi</li>
<li>Ram</li>
</ul>

<button id="add">Add</button>
<button id="remove">Remove</button>

<script>
$("#add").click(function() {
    $("#list").append("<li>Sita</li>");
});

$("#remove").click(function() {
    $("#list li:last").remove();
});
</script>

</body>
</html>
