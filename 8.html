<!DOCTYPE html>
<html>
<head>

<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-app>

    <form name="f" novalidate>

    Name:
    <input name="name" ng-model ="name" required><br><br>
    Roll No:
    <input name="rollno" ng-model="rollno" required><br><br>

    Branch:
    <input name="branch" ng-model = "branch" required><br><br>

    <button type="submit" ng-disabled="f.$invalid">Submit</button>

    </form>

    <p>Name: {{name}}</p>
    <p>Roll No: {{rollno}}</p>
    <p>Branch: {{branch}}</p>

    <p ng-if="f.$valid">Form is Valid</p>
    <p ng-if="f.$invalid">Form is Invalid</p>
</body>
</html>
