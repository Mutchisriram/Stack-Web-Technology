<!DOCTYPE html>
<html>
<head>

<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

</head>

<body ng-app>

    <input ng-model="name">
    <input type="number" ng-model="fee">

    <p>Original: {{name}}</p>
    <p>Uppercase: {{name | uppercase}}</p>
    <p>Lowercase: {{name | lowercase}}</p>

    <p>Original Fee: {{fee}}</p>
    <p>Currency: {{fee | currency}}</p>
</body>
</html>
