<!DOCTYPE html>
<html>
<head>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<h2 id="head">Student Details</h2>
<button id="btn">Change Style</button>

<script>
$("#btn").click(function() {
    $("#head").css("color", "blue");
    $("#head").css("background", "yellow");
});
</script>

</body>
</html>
